{% extends "accounts/base_auth.html" %}
{% block title %}Reset Link Sent{% endblock %}
{% block auth_content %}
<div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-6">
  <div class="card auth-card text-center animate__animated animate__fadeInUp">
    <div class="card-body p-5">
      <i class="bi bi-envelope-check display-4 text-success"></i>
      <h1 class="auth-heading h4 mt-3">Check your email</h1>
      <p class="text-muted small">If an account exists for that address, a password reset link has been sent. In development the email is printed in the terminal.</p>
      <a class="btn auth-btn text-white mt-3" href="{% url 'accounts:login' %}">Back to Login</a>
    </div>
  </div>
</div></div>
{% endblock %}
