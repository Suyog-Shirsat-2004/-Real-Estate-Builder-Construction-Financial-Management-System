{% extends "accounts/base_auth.html" %}
{% block title %}Password Changed{% endblock %}
{% block auth_content %}
<div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-6">
  <div class="card auth-card text-center animate__animated animate__fadeInUp">
    <div class="card-body p-5">
      <i class="bi bi-check-circle display-4 text-success"></i>
      <h1 class="auth-heading h4 mt-3">Password changed successfully</h1>
      <p class="text-muted small">You can now log in with your new password.</p>
      <a class="btn auth-btn text-white mt-3" href="{% url 'accounts:login' %}">Go to Login</a>
    </div>
  </div>
</div></div>
{% endblock %}
