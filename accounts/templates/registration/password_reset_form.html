{% extends "accounts/base_auth.html" %}
{% block title %}Reset Password{% endblock %}
{% block auth_content %}
<div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-6">
  <div class="card auth-card animate__animated animate__fadeInUp">
    <div class="card-body">
      <div class="text-center mb-4">
        <i class="bi bi-key display-5 text-primary"></i>
        <h1 class="auth-heading h4 mt-2">Forgot your password?</h1>
        <p class="auth-subheading small">Enter your registered email address and we will send you a reset link.</p>
      </div>
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-grid mt-3">
          <button type="submit" class="btn auth-btn text-white"><i class="bi bi-envelope-paper me-2"></i>Send reset link</button>
        </div>
      </form>
      <div class="text-center mt-3"><a class="auth-link small" href="{% url 'accounts:login' %}">Back to Login</a></div>
    </div>
  </div>
</div></div>
{% endblock %}
